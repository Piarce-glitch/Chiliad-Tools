<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Chiliad Tools – Modern UI</title>
  <!-- Tailwind CSS через CDN (самый простой способ) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-indigo-700 text-white p-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold">Chiliad Tools</h1>
    <button id="reportBtn" class="bg-indigo-500 hover:bg-indigo-400 px-3 py-1 rounded">
      Report abuse
    </button>
  </header>

  <!-- Main content -->
  <main class="flex-1 container mx-auto p-4 grid gap-6 grid-cols-1 lg:grid-cols-2">

    <!-- Инструменты (переключатели) -->
    <section class="bg-white rounded shadow p-4">
      <h2 class="text-xl font-semibold mb-3">Инструменты</h2>
      <div class="space-y-2">
        <label class="flex items-center space-x-2">
          <input type="checkbox" data-key="openInput" class="toggle">
          <span>Открыть поле ввода</span>
        </label>
        <label class="flex items-center space-x-2">
          <input type="checkbox" data-key="openNotebook" class="toggle">
          <span>Открыть блокнот</span>
        </label>
        <!-- Добавьте остальные переключатели при необходимости -->
      </div>
    </section>

    <!-- Таблица оружия -->
    <section class="bg-white rounded shadow p-4 overflow-x-auto">
      <h2 class="text-xl font-semibold mb-3">Оружие</h2>
      <table class="min-w-full border-collapse">
        <thead class="bg-gray-200">
          <tr>
            <th class="p-2">Фракция</th>
            <th class="p-2">Действие</th>
            <th class="p-2">Текст</th>
            <th class="p-2">Описание</th>
          </tr>
        </thead>
        <tbody id="weaponTableBody"></tbody>
      </table>
    </section>

    <!-- Логи -->
    <section class="bg-white rounded shadow p-4 col-span-2">
      <h2 class="text-xl font-semibold mb-3">Логи</h2>
      <pre id="logArea" class="bg-gray-50 p-2 rounded h-48 overflow-y-auto"></pre>
      <button id="clearLog" class="mt-2 bg-red-500 hover:bg-red-400 text-white px-3 py-1 rounded">
        Очистить логи
      </button>
    </section>

  </main>

  <!-- Footer -->
  <footer class="bg-gray-200 text-center p-2 text-sm">
    © 2026 Chiliad Tools – modern rewrite
  </footer>

  <script src="app.js"></script>
</body>
</html>
